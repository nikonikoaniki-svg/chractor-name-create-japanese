<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>キャラ名工房（日本人編）</title>
<meta property="og:type" content="website">
<meta property="og:title" content="キャラ名工房（日本人編）">
<meta property="og:description" content="物語を彩る、唯一の名前を。創作のための日本人名ジェネレーター。">
<meta property="og:image" content="ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="キャラ名工房（日本人編）">
<meta name="twitter:description" content="物語を彩る、唯一の名前を。創作のための日本人名ジェネレーター。">
<meta name="twitter:image" content="ogp.png">
<link rel="stylesheet" href="style.css"></head><body>
<main class="app"><header><h1>キャラ名工房 <span>日本人編</span></h1><div class="count">辞書 <b id="dbCount">17,000</b>項目</div></header>
<div class="workspace">
<section class="panel settings"><h2>キャラのイメージ</h2>
<div class="field"><h3>性別</h3><div class="chips single" data-group="gender"><button class="chip active" data-value="any">指定なし</button><button class="chip" data-value="male">男性</button><button class="chip" data-value="female">女性</button><button class="chip" data-value="neutral">中性的</button></div></div>
<div class="field"><h3>雰囲気 <small>複数選択可</small></h3><div class="chips multi" data-group="mood"><button class="chip" data-value="strong">強い</button><button class="chip" data-value="cool">クール</button><button class="chip" data-value="mysterious">神秘的</button><button class="chip" data-value="dark">妖しい</button><button class="chip" data-value="smart">知的</button><button class="chip" data-value="gentle">優しい</button><button class="chip" data-value="bright">明るい</button><button class="chip" data-value="fragile">儚い</button><button class="chip" data-value="elegant">上品</button><button class="chip" data-value="old">古風</button></div></div>
<div class="field"><h3>モチーフ</h3><div class="chips single" data-group="motif"><button class="chip active" data-value="none">なし</button><button class="chip" data-value="moon">月</button><button class="chip" data-value="night">夜</button><button class="chip" data-value="snow">雪</button><button class="chip" data-value="water">水</button><button class="chip" data-value="fire">炎</button><button class="chip" data-value="thunder">雷</button><button class="chip" data-value="wind">風</button><button class="chip" data-value="flower">花</button><button class="chip" data-value="sky">空</button><button class="chip" data-value="shadow">影</button><button class="chip" data-value="beast">獣</button></div></div>
<button id="generateAll" class="primary wide">名前をつくる</button></section>
<section class="right"><div class="result"><article class="name-card"><span class="label">姓</span><div id="surnameText" class="name">月城</div><div class="actions"><button id="surnameBack" class="secondary" disabled>← 戻る</button><button id="surnameSpin" class="primary">姓を回す</button></div></article><div class="plus">＋</div><article class="name-card"><span class="label">名</span><div id="givenText" class="name">朔夜</div><div class="actions"><button id="givenBack" class="secondary" disabled>← 戻る</button><button id="givenSpin" class="primary">名を回す</button></div></article></div>
<div class="panel full"><div><small>できあがった名前</small><div id="fullName" class="full-name"></div></div><button id="saveFavorite" class="save">♡ 保存</button></div></section></div>
<details id="favoritesBox" class="panel footerbox"><summary>お気に入り <span id="favCount">0</span></summary><div id="favoriteList"></div><button id="clearFavorites" class="clear">すべて消す</button></details>
<details class="panel footerbox"><summary>辞書・生成ルール</summary><div id="stats" class="stats"></div></details>
</main><script src="db.js"></script><script src="app.js"></script></body></html>
